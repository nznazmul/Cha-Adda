<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cha Adda - চা আড্ডা</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #0d0a14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-container {
      margin-bottom: 18px;
    }
    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(244, 63, 94, 0.3);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(244, 63, 94, 0.2);
      border-top-color: #f43f5e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f43f5e, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-text {
      color: #9ca3af;
      font-size: 14px;
      margin: 0 0 24px 0;
      transition: color 0.3s;
    }
    .error-card {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      max-width: 340px;
      width: 100%;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
      color: #d1d5db;
      margin-top: 10px;
    }
    .dev-panel {
      display: none;
      margin-top: 16px;
      text-align: left;
    }
    .dev-panel label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .dev-panel input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 13px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .dev-panel input:focus {
      outline: none;
      border-color: #f43f5e;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="icon-192.png" alt="Cha Adda Logo" class="logo-img" onerror="this.style.display='none'">
  </div>
  
  <div id="spinner" class="spinner"></div>
  <h2>চা আড্ডা (Cha Adda)</h2>
  <p id="status" class="status-text">Connecting to secure mobile servers...</p>

  <div id="error-card" class="error-card">
    <p style="color: #fca5a5; font-size: 13px; margin: 0 0 16px 0;">
      Unable to reach server. Please check your internet connection.
    </p>
    <button class="btn" onclick="retryConnection()">
      🔄 Retry Connection
    </button>
    <button class="btn btn-secondary" onclick="toggleDevPanel()">
      ⚙️ Change Server URL
    </button>
    <div id="dev-panel" class="dev-panel">
      <label>Server Endpoint:</label>
      <input type="text" id="custom-url-input" placeholder="http://10.0.2.2:3000">
      <button class="btn" style="padding: 8px 12px; font-size: 12px;" onclick="applyCustomUrl()">
        Save & Connect
      </button>
    </div>
  </div>

  <script>
    const DEFAULT_SERVER = "https://cha-adda-meet-swap.vercel.app";
    const statusEl = document.getElementById("status");
    const spinnerEl = document.getElementById("spinner");
    const errorCardEl = document.getElementById("error-card");
    const customUrlInput = document.getElementById("custom-url-input");

    function getTargetUrl() {
      try {
        return localStorage.getItem("cha_adda_custom_server") || DEFAULT_SERVER;
      } catch (e) {
        return DEFAULT_SERVER;
      }
    }

    function redirectToTarget() {
      const url = getTargetUrl();
      if (customUrlInput) {
        customUrlInput.value = url;
      }
      
      // Attempt redirect immediately
      window.location.replace(url);

      // If redirect fails or takes longer than 5 seconds (offline/network issue)
      setTimeout(() => {
        if (spinnerEl) spinnerEl.style.display = "none";
        if (statusEl) {
          statusEl.textContent = "Offline or slow connection";
          statusEl.style.color = "#f87171";
        }
        if (errorCardEl) {
          errorCardEl.style.display = "block";
        }
      }, 5000);
    }

    function retryConnection() {
      if (errorCardEl) errorCardEl.style.display = "none";
      if (spinnerEl) spinnerEl.style.display = "block";
      if (statusEl) {
        statusEl.textContent = "Connecting to secure mobile servers...";
        statusEl.style.color = "#9ca3af";
      }
      const url = getTargetUrl();
      window.location.replace(url);
      setTimeout(() => {
        if (errorCardEl) errorCardEl.style.display = "block";
        if (spinnerEl) spinnerEl.style.display = "none";
      }, 5000);
    }

    function toggleDevPanel() {
      const panel = document.getElementById("dev-panel");
      if (panel) {
        panel.style.display = panel.style.display === "block" ? "none" : "block";
      }
    }

    function applyCustomUrl() {
      const val = customUrlInput ? customUrlInput.value.trim() : "";
      if (val) {
        try {
          localStorage.setItem("cha_adda_custom_server", val);
        } catch (e) {}
        retryConnection();
      }
    }

    window.addEventListener("online", () => {
      retryConnection();
    });

    // Start connection immediately
    redirectToTarget();
  </script>
</body>
</html>
